name: tests
# T3: a commit's checks run once: on pull requests, and on pushes only to main and release-* (the family's rule 17).
on:
  pull_request:
  push:
    branches: [main, 'release-*']
permissions:
  contents: read
# T4: Mac jobs are shared by the whole family (rule 17): a newer push to a pull request cancels that pull request's
# older runs; a run on main or a release branch has a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Named runner images, never "latest": a moved image is a change nobody reviewed. 3.9 is the floor the
        # script checks first (G1.12; the python3 that comes with Apple's developer tools is 3.9.6 on macOS 13).
        include:
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: macos-26, python: "3.9"}
        # T4: a pull request runs ONE Mac job, the floor's Python; the rest of the Mac matrix is test-mac below.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a release branch is compared with main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The mode of each folder above the Python that runs the tests (the skill's walk reads them)
        run: |
          python -I - <<'PY'
          import os, stat, sys
          d = os.path.dirname(sys.executable)
          while True:
              s = os.stat(d)
              print(stat.filemode(s.st_mode), "uid", s.st_uid, d)
              if os.path.dirname(d) == d:
                  break
              d = os.path.dirname(d)
          PY
      - name: The tests, with the real pinned Gitea (downloaded and checked against its pin by the tests)
        env:
          WSM_REQUIRE_GITEA: "1"
          WSM_TEST_CACHE: ${{ runner.temp }}/wsm-cache
          WSM_TEST_REPORT: ${{ runner.temp }}/report.json
          WSM_OTHER_ACCOUNT: nobody       # G8.7: another account holds the forge's port (sudo, no password, on runners)
        run: python -I tests/test_mirror.py -v
      - name: Keep what this job saw pass, for the join
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
  test-mac:
    # T4: Mac jobs are shared by the whole family (rule 17): the full Mac matrix runs on main and release-* only.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a release branch is compared with main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The mode of each folder above the Python that runs the tests (the skill's walk reads them)
        run: |
          python -I - <<'PY'
          import os, stat, sys
          d = os.path.dirname(sys.executable)
          while True:
              s = os.stat(d)
              print(stat.filemode(s.st_mode), "uid", s.st_uid, d)
              if os.path.dirname(d) == d:
                  break
              d = os.path.dirname(d)
          PY
      - name: The tests, with the real pinned Gitea (downloaded and checked against its pin by the tests)
        env:
          WSM_REQUIRE_GITEA: "1"
          WSM_TEST_CACHE: ${{ runner.temp }}/wsm-cache
          WSM_TEST_REPORT: ${{ runner.temp }}/report.json
          WSM_OTHER_ACCOUNT: nobody       # G8.7: another account holds the forge's port (sudo, no password, on runners)
        run: python -I tests/test_mirror.py -v
      - name: Keep what this job saw pass, for the join
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
  gate:
    needs: [test, test-mac]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a release branch is compared with main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
      - name: Every proof the plan names, and every built row's test, passed on at least one of the event's jobs
        # T4: the reports of the event it runs on: four on a pull request, five on main and release-*.
        run: python -I tests/test_mirror.py --join --expect ${{ github.event_name == 'pull_request' && 4 || 5 }} reports/*/report.json
  skill-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a release branch is compared with main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, yaml
          version = json.load(open(".claude-plugin/plugin.json"))["version"]
          skills = glob.glob("skills/*/SKILL.md")
          if not skills:
              assert version == "0.0.0", "a version above 0.0.0 needs a skill"
              print("no skill yet (version 0.0.0, nothing released)")
          for p in skills:
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              json.load(open(p)); print("ok", p)
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls skills/*/SKILL.md >/dev/null 2>&1; then
            echo "no skill yet: the validator runs from the first change that adds one"
          elif gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "::warning::this runner's gh has no 'skill' command; the strict YAML step above still ran"
          fi
